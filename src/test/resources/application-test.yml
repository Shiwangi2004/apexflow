spring:
  application:
    name: vehicle-incentive-engine-test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: test-group
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      claim-submitted: claims.submitted.v1
